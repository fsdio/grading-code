<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Results and Spec Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: #333;
            font-size: 1.8em;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            font-size: 1.5em;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #000;
            color: #fff;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 15px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
            margin: 10px 0;
            font-size: 1em;
        }

        button:hover {
            background-color: #555;
        }

        .mismatch {
            background-color: #ffcccc;
            color: #a00;
        }

        .match {
            background-color: #ccffcc;
            color: #080;
        }


        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }

            h2 {
                font-size: 1.2em;
            }

            button {
                padding: 8px 12px;
                font-size: 0.9em;
            }

            th,
            td {
                padding: 8px;
                font-size: 0.9em;
            }

            textarea {
                font-size: 0.9em;
            }

        }

        ul {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <button type="button" onclick="window.location.href='./peninjau.html'">HOME</button>
        <h1 id="problemTitle">HASIL PENINJAUAN</h1>
        <div>
            <div class="form-group" hidden>
                <input type="text" id="problemInput">
            </div>
            <div class="form-group">
                <label>SPESIFIKASI PENINJAU</label>
                <div id="resultPeninjauSpec"></div>
            </div>
            <button onclick="fetchSpec()" hidden></button>
        </div>
        <label>HASIL PENINJAUAN KODE SUMBER</label>
        <div id="resultsContainer"></div>
    </div>

    <script>
        async function fetchResults(problem) {
            try {
                const response = await fetch(`/penilai/${problem}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const results = await response.json();
                displayResults(problem, results);
            } catch (error) {
                console.error('Error fetching results:', error);
                document.getElementById('resultsContainer').innerHTML = `<p>Error fetching results: ${error.message}</p>`;
            }
        }

        async function displayResults(problem, results) {
            document.getElementById('problemTitle').innerText = `Hasil Peninjauan: ${problem}`;
            const resultsContainer = document.getElementById('resultsContainer');
            const response = await fetch(`/get-spec/${problem}`);
            const spec = await response.json();

            if (results.length === 0) {
                resultsContainer.innerHTML = `<p>No results found for this problem</p>`;
            } else {
                resultsContainer.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Functions</th>
                        <th>Classes</th>
                        <th>Variables</th>
                        <th>Equal Compiler</th>
                    </tr>
                </thead>
                <tbody>
                    ${results.map(result => {
                    return `
                            <tr>
                                <td>${result.fileName}</td>
                                <td>
                                    <ul>
                                        ${result.specProgrammers.functions ? result.specProgrammers.functions.map(func => `<li class="${cekStringDalamJSON(spec.functions, func)}">${func}</li>`).join('') : '<li>N/A</li>'}
                                    </ul>
                                </td>
                                <td>
                                    <ul>
                                        ${result.specProgrammers.classes ? result.specProgrammers.classes.map(func => `<li class="${cekStringDalamJSON(spec.classes, func)}">${func}</li>`).join('') : '<li>N/A</li>'}
                                    </ul>
                                </td>
                                <td>
                                    <ul>
                                        ${result.specProgrammers.variables ? result.specProgrammers.variables.map(func => `<li class="${cekStringDalamJSON(spec.variables, func)}">${func}</li>`).join('') : '<li>N/A</li>'}
                                    </ul>
                                </td>
                                <td>${result.specProgrammers.equalCompile ? 'BERHASIL' : 'GAGAL'}</td>
                            </tr>
                        `;
                }).join('')}
                </tbody>
            </table>
        `;
            }
        }

        async function fetchSpec() {
            const problem = document.getElementById('problemInput').value;
            const resultPeninjauSpec = document.getElementById('resultPeninjauSpec');

            if (!problem) {
                alert('Please enter a problem name.');
                return;
            }

            try {
                const response = await fetch(`/get-spec/${problem}`);
                if (response.ok) {
                    const spec = await response.json();
                    resultPeninjauSpec.innerHTML = `
            <table id="specTable">
                <thead>
                    <tr>
                        <th data-label="Functions">Functions</th>
                        <th data-label="Classes">Classes</th>
                        <th data-label="Variables">Variables</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td data-label="Functions">
                            <ul>
                                ${spec.functions.map(func => `<li>${func}</li>`).join('')}
                            </ul>    
                        </td>
                        <td data-label="Classes">
                            <ul>
                                ${spec.classes.map(func => `<li>${func}</li>`).join('')}
                            </ul>    
                        </td>
                        <td data-label="Variables">
                            <ul>
                                ${spec.variables.map(func => `<li>${func}</li>`).join('')}
                            </ul>    
                        </td>
                    </tr>
                </tbody>
            </table>
                    `;
                    document.getElementById('specTextarea').value = JSON.stringify(spec, null, 2);
                } else {
                    document.getElementById('specTextarea').value = 'spec.json not found';
                }
            } catch (error) {
                console.error('Error fetching spec.json:', error);
            }
        }

        function cekStringDalamJSON(objekJSON, stringDicari) {
            for (let key in objekJSON) {
                if (objekJSON[key] === stringDicari) {
                    return "match";
                }
            }
            return "mismatch";
        }

        const urlParams = new URLSearchParams(window.location.search);
        const problem = urlParams.get('problem');
        if (problem) {
            document.getElementById('problemInput').value = problem;
            fetchResults(problem);
            fetchSpec();
        }
    </script>
</body>

</html>
